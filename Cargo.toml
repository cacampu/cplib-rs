[workspace]
members = [ "crates/*/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rand = "0.9.2"
prim = { path = "crates/core/prim" }
algebra = { path = "crates/core/algebra" }
modint = { path = "crates/math/modint" }
convolution = { path = "crates/math/convolution" }
fps = { path = "crates/math/fps" }
segtree = { path = "crates/sequence/segtree" }
prefix-sum = { path = "crates/sequence/prefix-sum" }

syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
