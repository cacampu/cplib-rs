[package]
name = "cplib-playground"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "cplib-playground"

[dependencies]
# AtCoder の固定版と手続きマクロの依存が共存できることも検証する。
indexmap = "=2.11.0"
cplib-lang-io = { package = "io", path = "../crates/lang/io" }
cplib-math-vector = { package = "vector", path = "../crates/math/vector" }
cplib-graph-grid = { package = "grid", path = "../crates/graph/grid" }
cplib-lang-macros = { package = "macros", path = "../crates/lang/macros" }
cplib-search-binary-search = { package = "binary-search", path = "../crates/search/binary-search" }
cplib-math-modint = { package = "modint", path = "../crates/math/modint" }

[package.metadata.cargo-compete.bin]
vector = { problem = "https://atcoder.jp/contests/abc234/tasks/abc234_b"}
grid = { problem = "https://atcoder.jp/contests/abc007/tasks/abc007_3"}
numeric-grid = { problem = "https://atcoder.jp/contests/abc356/tasks/abc356_b"}
multi-testcase = { problem = "https://atcoder.jp/contests/arc163/tasks/arc163_a"}
